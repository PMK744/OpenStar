name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  extension:
    # The browser extension is platform-agnostic, so it's built and packed once.
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:extension
      - name: Pack
        run: |
          mkdir -p dist
          (cd tools/login-helper/dist && zip -qr "${GITHUB_WORKSPACE}/dist/openstar-login-helper-${V}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: openstar-login-helper
          path: dist/openstar-login-helper-*.zip
          if-no-files-found: error

  apps:
    # Self-contained per-OS builds of the API and web apps (download-and-run).
    # The Linux outputs are reused by the docker job (built once, not twice).
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64]
    env:
      V: ${{ needs.version.outputs.value }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install JS dependencies
        run: bun install

      - name: Build front-end and login-helper extension
        # Produces applications/web/wwwroot and tools/login-helper/dist.
        run: bun run build

      - name: Publish API
        run: dotnet publish applications/api/OpenStar.Api.csproj -c Release -r "$RID" --self-contained true -o publish/api --nologo

      - name: Publish Web
        run: dotnet publish applications/web/OpenStar.Web.csproj -c Release -r "$RID" --self-contained true -o publish/web --nologo

      - name: Bundle login helper into the web output
        # So the web app's /login-helper.zip download works in the published artifact.
        run: |
          mkdir -p publish/web/tools/login-helper
          cp -r tools/login-helper/dist publish/web/tools/login-helper/dist

      - name: Pack
        run: |
          mkdir -p dist
          (cd publish/api && zip -qr "${GITHUB_WORKSPACE}/dist/openstar-api-${V}-${RID}.zip" .)
          (cd publish/web && zip -qr "${GITHUB_WORKSPACE}/dist/openstar-web-${V}-${RID}.zip" .)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: openstar-api-${{ matrix.rid }}
          path: dist/openstar-api-*-${{ matrix.rid }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: openstar-web-${{ matrix.rid }}
          path: dist/openstar-web-*-${{ matrix.rid }}.zip
          if-no-files-found: error

      # Hand the raw Linux output to the docker job so the image isn't rebuilt.
      - name: Stage runtime payload for docker
        if: startsWith(matrix.rid, 'linux')
        run: |
          mkdir -p oci/api oci/web
          cp -r publish/api/. oci/api/
          cp -r publish/web/. oci/web/
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.rid, 'linux')
        with:
          name: oci-${{ matrix.rid }}
          path: oci
          if-no-files-found: error

  docker:
    # Builds the multi-arch image from the apps job's published output — no recompile.
    needs: apps
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect published output
        uses: actions/download-artifact@v4
        with:
          pattern: oci-linux-*
          path: downloaded

      - name: Assemble build context
        # Dockerfile.ci picks the arch dir via TARGETARCH (amd64 / arm64).
        run: |
          mkdir -p context/amd64 context/arm64
          cp -r downloaded/oci-linux-x64/. context/amd64/
          cp -r downloaded/oci-linux-arm64/. context/arm64/
          cp docker/entrypoint.sh context/entrypoint.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: context
          file: docker/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [extension, apps]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "openstar-*"
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
